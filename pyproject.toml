[project]
name = "enclave"
version = "0.1.0"
description = "Enclave — TEE-Protected AI Agent Platform"
requires-python = ">=3.12"
dependencies = [
    "pynacl>=1.5.0",
    "cryptography>=42.0.0",
    "cbor2>=5.6.0",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "aiosqlite>=0.20.0",
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
gemini = ["google-genai>=1.0.0"]
all-llm = [
    "openai>=1.40.0",
    "google-genai>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "bandit>=1.7.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[project.scripts]
enclave-tui = "tui:main"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.setuptools.packages.find]
include = ["enclave*", "host*"]
